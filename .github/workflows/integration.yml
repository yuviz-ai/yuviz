name: Integration

on:
  pull_request_review:
    types: [submitted]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-integration:
    if: github.event_name != 'pull_request_review' || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_DSN: postgresql://voiceai:voiceai@localhost:5432/voiceai
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-insecure-secret-do-not-deploy-ci-only-insecure-secret-do-not-deploy-
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: voiceai
          POSTGRES_PASSWORD: voiceai
          POSTGRES_DB: voiceai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voiceai -d voiceai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install CPU torch then requirements
        run: |
          torch_version="$(sed -n 's/^torch==//p' requirements.txt)"
          test -n "$torch_version"
          pip install --no-cache-dir "torch==${torch_version}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Provision Silero VAD model
        run: |
          mkdir -p models
          src="$(python -c 'import faster_whisper, pathlib; print(pathlib.Path(faster_whisper.__file__).parent / "assets" / "silero_vad_v6.onnx")')"
          test -f "$src"
          cp "$src" models/silero_vad.onnx

      - name: Apply database schemas
        run: |
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f database/schema.sql
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f database/knowledge_schema.sql
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -f database/telephony_schema.sql

      - name: Run integration pytest
        run: |
          pytest -m integration \
            --deselect services/knowledge/tests/test_retrieval.py::test_retrieve_end_to_end_with_real_ollama_embeddings \
            --deselect services/knowledge/tests/test_retrieval.py::test_prompt_mode_document_coexists_with_vector_search_results \
            --deselect services/knowledge/tests/test_retrieval.py::test_prompt_mode_document_excluded_from_ordinary_vector_search \
            --deselect services/knowledge/tests/test_ingestion_worker.py::test_process_one_job_success_produces_ready_document_and_chunks \
            --deselect services/knowledge/tests/test_ingestion_worker.py::test_manual_prompt_override_survives_reingestion_of_large_document

  # Required check: a skipped python-integration would otherwise count as passing.
  integration-gate:
    needs: [python-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Evaluate integration result
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.review.state }}
          RESULT: ${{ needs.python-integration.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          echo "event=$EVENT state=$STATE result=$RESULT"
          case "$EVENT" in
            pull_request_review)
              if [ "$BASE_REF" != "main" ]; then
                echo "Integration gate only certifies PRs into main"
                exit 1
              fi
              if [ "$STATE" = "approved" ]; then
                test "$RESULT" = "success"
                exit 0
              fi
              [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$HEAD_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "Unexpected PR metadata"; exit 1; }
              # Fork-headed runs have an empty pull_requests[]; match those by head repo instead.
              counts="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request_review&status=success" \
                --jq "[.workflow_runs[] | select(.name == \"Integration\" and (any(.pull_requests[]; .number == $PR_NUMBER and .base.ref == \"main\") or ((.pull_requests | length) == 0 and .head_repository.full_name == \"$HEAD_REPO\" and \"$HEAD_REPO\" != \"$GITHUB_REPOSITORY\")))] | length")"
              total=0
              for c in $counts; do
                [[ "$c" =~ ^[0-9]+$ ]] || { echo "Unexpected gh output: $c"; exit 1; }
                total=$((total + c))
              done
              if [ "$total" -eq 0 ]; then
                echo "Integration runs on an approving review; none has succeeded for $HEAD_SHA yet"
                exit 1
              fi
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "Manual Integration runs are main-only; PRs need an approving review"
                exit 1
              fi
              test "$RESULT" = "success"
              ;;
            push)
              test "$RESULT" = "success"
              ;;
            *)
              echo "Unexpected event: $EVENT"
              exit 1
              ;;
          esac
