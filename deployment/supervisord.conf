[eventlistener:crash-watch]
; Restart at once, then wait 2, 4, 8 s; then a circuit breaker: 5 crashes in 10 min, trial start after 5 min (doubling to 1 h).
command=/usr/bin/env python3 deployment/supervisor_crash_watch.py
directory=%(here)s/..
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
autorestart=true
stdout_logfile=NONE
stderr_logfile=%(ENV_HOME)s/.yuviz/logs/crash-watch.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=2

[eventlistener:log-rotate]
; Rotates service logs over 20 MB, hourly; keeps 3.
command=/usr/bin/env python3 deployment/supervisor_log_rotate.py
directory=%(here)s/..
events=TICK_3600
autorestart=true
stdout_logfile=NONE
stderr_logfile=%(ENV_HOME)s/.yuviz/logs/log-rotate.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
