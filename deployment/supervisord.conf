; Foreground tab: supervisord -c deployment/supervisord.conf. Data stores stay under brew services.

[supervisord]
nodaemon=true
logfile=%(ENV_HOME)s/.yuviz/logs/supervisord.log
pidfile=%(ENV_HOME)s/.yuviz/supervisord.pid
childlogdir=%(ENV_HOME)s/.yuviz/logs
; .env beats whatever the launching tab exported, so a .env edit takes effect on restart.
environment=YUVIZ_ENV_FILE_WINS="1"

[unix_http_server]
file=%(ENV_HOME)s/.yuviz/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix://%(ENV_HOME)s/.yuviz/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Services log to their own files, keeping supervisord's pipe off the audio path.
; trap keeps the bash wrapper alive until the service exits, so killasgroup can't miss a hung one.

[program:kamailio]
command=/bin/bash -c 'trap : TERM INT; . scripts/start_local.sh >/dev/null && start_kamailio >> "$YUVIZ_LOGS/kamailio.log" 2>&1'
directory=%(here)s/..
priority=10
startsecs=3
stopwaitsecs=15
stopasgroup=true
killasgroup=true
autorestart=true
redirect_stderr=true
stdout_logfile=%(ENV_HOME)s/.yuviz/logs/%(program_name)s.supervisor.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1

