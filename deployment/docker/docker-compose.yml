# Local dev stack. Run ./dev.sh rather than `docker compose up` directly.
# Ports bind to 127.0.0.1 — default credentials, and no auth on redis/ollama.

x-python-service: &python-service
  build:
    context: .
    dockerfile: deployment/docker/Dockerfile.python
    args:
      SPACY_MODEL_URL: ${SPACY_MODEL_URL:-}
  image: yuviz-python:dev
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    # pgvector, not postgres:14 — knowledge_schema.sql needs CREATE EXTENSION vector.
    image: pgvector/pgvector:pg14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voiceai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceai}
      POSTGRES_DB: ${POSTGRES_DB:-voiceai}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceai} -d ${POSTGRES_DB:-voiceai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Skipped when USE_HOST_OLLAMA=1; dev.sh drops the profile.
    profiles: ["ollama-container"]
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  init:
    <<: *python-service
    restart: "no"
    command: ["bash", "/app/deployment/sh/init.sh"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      CONFIG_SERVICE_EMAIL: ${CONFIG_SERVICE_EMAIL}
      CONFIG_SERVICE_PASSWORD: ${CONFIG_SERVICE_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      VOICEAI_STT_MODEL: ${VOICEAI_STT_MODEL:-small.en}
      # dev.sh --llm-model. The seed writes it into the default agent's
      # provider row, so this and the conversation service must agree.
      VOICEAI_LLM_MODEL: ${VOICEAI_LLM_MODEL:-llama3.2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  config:
    <<: *python-service
    command: ["python", "-m", "uvicorn", "services.config.app:app",
              "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CONFIG_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  knowledge:
    <<: *python-service
    command: ["python", "-m", "uvicorn", "services.knowledge.app:app",
              "--host", "0.0.0.0", "--port", "8100"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge_documents
      # Embedding providers resolve api_key_ref too (embedding_manager.py).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${KNOWLEDGE_PORT:-8100}:8100"
    volumes:
      - knowledge-docs:/app/data/knowledge_documents
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  conversation:
    <<: *python-service
    command: ["python", "-m", "services.conversation",
              "--port", "50051", "--mode", "pipeline", "--log-level", "INFO"]
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN}
      REDIS_URL: ${REDIS_URL}
      CONFIG_SERVICE_URL: http://config:8000
      CONFIG_SERVICE_EMAIL: ${CONFIG_SERVICE_EMAIL}
      CONFIG_SERVICE_PASSWORD: ${CONFIG_SERVICE_PASSWORD}
      KNOWLEDGE_SERVICE_URL: http://knowledge:8100
      # pipeline_config.py defaults to "macos", which needs the macOS `say` binary.
      VOICEAI_TTS_ENGINE: kokoro
      VOICEAI_TTS_VOICE: af_sarah
      VOICEAI_STT_MODEL: ${VOICEAI_STT_MODEL:-small.en}
      VOICEAI_LLM_MODEL: ${VOICEAI_LLM_MODEL:-llama3.2}
      # dev.sh --no-stt / --no-tts. Off keeps the model out of startup (see
      # _prewarm_agents); default on, so a normal run is unchanged.
      VOICEAI_ENABLE_STT: ${VOICEAI_ENABLE_STT:-1}
      VOICEAI_ENABLE_TTS: ${VOICEAI_ENABLE_TTS:-1}
      VOICEAI_LLM_URL: ${OLLAMA_BASE_URL}
      # Cloud LLM keys. The container's environment is an explicit allow-list,
      # so a key in deployment/.env does NOT reach this process unless it is
      # named here. Referenced from a provider_configs row as
      # api_key_ref='env:GEMINI_API_KEY' — the row stores the reference, never
      # the key itself (see services/conversation/secret_resolver.py).
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${CONVERSATION_PORT:-50051}:50051"
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sys,grpc;from grpc_health.v1 import health_pb2,health_pb2_grpc;sys.exit(0 if health_pb2_grpc.HealthStub(grpc.insecure_channel('localhost:50051')).Check(health_pb2.HealthCheckRequest(),timeout=5).status==1 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 60
      # First run downloads whisper + kokoro before it can serve.
      start_period: 300s

  webcall:
    <<: *python-service
    command: ["python", "-m", "services.webcall", "--port", "8300"]
    environment:
      # Direct to conversation — this stack runs no Envoy, which webcall's :10000 default expects.
      CONVERSATION_SVC_TARGET: conversation:50051
      LOG_LEVEL: INFO
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEBCALL_PORT:-8300}:8300"
    depends_on:
      conversation:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket;socket.create_connection(('localhost',8300),3).close()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  admin-ui:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.adminui
    image: yuviz-adminui:dev
    restart: unless-stopped
    # Baked into the browser bundle, so these must resolve from the host.
    environment:
      NEXT_PUBLIC_CONFIG_SERVICE_URL: http://localhost:${CONFIG_PORT:-8000}
      NEXT_PUBLIC_KNOWLEDGE_SERVICE_URL: http://localhost:${KNOWLEDGE_PORT:-8100}
      NEXT_PUBLIC_WEBCALL_URL: ws://localhost:${WEBCALL_PORT:-8300}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${ADMIN_UI_PORT:-3000}:3000"
    volumes:
      - ./admin-ui:/app/admin-ui
      - /app/admin-ui/node_modules
    depends_on:
      config:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  ollama-models:
  hf-cache:
  knowledge-docs:
