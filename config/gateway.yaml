# Addresses and secrets come from .env (CONVERSATION_SVC_TARGET, REDIS_URL,
# FREESWITCH_ESL_*, SIP_PROXY_*); this file only tunes behaviour.
gateway:
  websocket:
    port: 8080
    max_connections: 1000
    timeout_ms: 30000
    metadata_wait_ms: 1500

  timers:
    no_speech_timeout_ms: 60000

  logging:
    level: "debug"
    console: true

  conversation:
    type: "grpc"
    connect_timeout_ms: 5000

  media:
    sample_rate: 16000             # 16 kHz — matches FasterWhisper native rate and TTS output
    channels: 1
    frame_ms: 20
    ring_buffer_ms: 500

  metrics:
    enabled: true
    port: 9090
    path: "/metrics"

  esl:
    # FreeSWITCH Event Socket: lets the gateway hang up the SIP leg when the agent ends the call.
    # Off means the SIP call lingers until the caller hangs up.
    enabled: true
    # password: from FREESWITCH_ESL_PASSWORD in .env — never committed here
    connect_timeout_ms: 2000
    # Transfer dials go via Kamailio at SIP_PROXY_HOST/PORT in .env; blank refuses them.

  redis:
    # Written by services/config: tenant:{slug} tuning and did:{did} routes.
    # Off or unreachable: tuning falls back to defaults; routing serves last-known-good
    # routes up to did_lkg_max_age_s, else rejects calls. command_timeout_ms is the outage threshold.
    enabled: true
    connect_timeout_ms: 200
    command_timeout_ms: 100
    did_lkg_max_age_s: 300
