static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: HTTP2
                stat_prefix: grpc_ingress
                route_config:
                  virtual_hosts:
                    - name: conversation_svc
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: conversation_svc
                            timeout: 0s    # no timeout — bidi streams are long-lived
                http_filters:
                  - name: envoy.filters.http.grpc_stats
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_stats.v3.FilterConfig
                      emit_filter_state: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: conversation_svc
      type: STATIC
      lb_policy: LEAST_REQUEST
      http2_protocol_options: {}
      load_assignment:
        cluster_name: conversation_svc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 50053 }
      health_checks:
        - timeout: 2s
          interval: 5s
          healthy_threshold: 1
          unhealthy_threshold: 2
          grpc_health_check:
            service_name: "voiceai.v1.ConversationService"

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }
